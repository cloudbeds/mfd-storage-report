name: 'Code Lint'
description: Python code linter

runs:
  using: composite
  steps:

    - name: Set up Python 3.10
      uses: actions/setup-python@d27e3f3d7c64b4bbf8e4abfb9b63b83e846e0435
      with:
        python-version: "3.10"

    - name: Lint
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit && pre-commit install
        make lint
